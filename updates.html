<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BI Team Weekly Updates</title>
<style>
:root {
  --navy:#10233f;
  --navy2:#17365f;
  --teal:#0f766e;
  --blue:#2563eb;
  --bg:#eef3f8;
  --panel:#fff;
  --line:#dbe3ec;
  --text:#172033;
  --muted:#667085;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:
    radial-gradient(circle at 88% 5%, rgba(37,99,235,.11), transparent 26rem),
    radial-gradient(circle at 4% 30%, rgba(15,118,110,.08), transparent 22rem),
    var(--bg);
  color:var(--text);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  line-height:1.6;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}

.header {
  padding: 32px 36px;
  border-radius: 22px;
  color: white;
  background: linear-gradient(135deg, #0b1f3a 0%, #17365f 58%, #0f766e 135%);
  box-shadow: 0 22px 60px rgba(15,35,63,.18);
  margin-bottom: 32px;
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}

.eyebrow {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #bae6fd;
  margin-bottom: 8px;
}

h1 {
  margin: 9px 0 7px;
  font-size: 42px;
  line-height: 1.1;
  letter-spacing: -.03em;
}

.header p {
  max-width: 780px;
  margin: 8px 0 0;
  line-height: 1.6;
  color: rgba(255,255,255,.78);
  font-size: 15px;
}

.stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.stat-box {
  min-width: 120px;
  padding: 14px 18px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 14px;
  background: rgba(255,255,255,.10);
  text-align: center;
}

.stat-box small {
  display: block;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #bae6fd;
  font-weight: 700;
  font-size: 10px;
  margin-bottom: 6px;
}

.stat-box strong {
  display: block;
  font-size: 32px;
  line-height: 1;
  margin-bottom: 2px;
}

.stat-box span {
  font-size: 12px;
  color: rgba(255,255,255,.75);
}

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.search-box {
  flex: 1;
  min-width: 280px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  transition: all 0.2s ease;
}

.search-box input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

.search-box::before {
  content: "🔍";
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
}

.filter-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.filter-btn:hover {
  background: #f8fafc;
  border-color: var(--blue);
}

.filter-btn.active {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}

.updates-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.update-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  transition: all 0.3s ease;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 12px rgba(15,35,63,.04);
}

.update-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(15,35,63,.12);
  border-color: var(--blue);
}

.update-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}

.week-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 62px;
  padding: 8px 14px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  color: white;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.02em;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.status-badge.green {
  background: #dcfce7;
  color: #166534;
}

.status-badge.amber {
  background: #fef3c7;
  color: #92400e;
}

.status-badge.red {
  background: #fee2e2;
  color: #991b1b;
}

.status-badge::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.update-date {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
  font-weight: 600;
}

.update-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--navy);
  margin: 0 0 12px 0;
  letter-spacing: -.02em;
}

.update-summary {
  font-size: 14px;
  color: #475569;
  line-height: 1.6;
  margin-bottom: 16px;
  flex: 1;
}

.update-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding-top: 16px;
  border-top: 1px solid #f1f5f9;
  font-size: 12px;
  color: var(--muted);
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.meta-item strong {
  color: var(--navy);
  font-weight: 700;
}

.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: var(--muted);
}

.empty-state-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state h3 {
  font-size: 20px;
  color: var(--navy);
  margin: 0 0 8px 0;
}

.empty-state p {
  font-size: 14px;
  margin: 0;
}

@media (max-width: 768px) {
  .container {
    padding: 16px;
  }

  .header {
    padding: 24px 20px;
  }

  h1 {
    font-size: 32px;
  }

  .header-content {
    flex-direction: column;
    align-items: flex-start;
  }

  .updates-grid {
    grid-template-columns: 1fr;
  }

  .controls {
    flex-direction: column;
    align-items: stretch;
  }

  .search-box {
    min-width: 100%;
  }

  .filter-group {
    justify-content: center;
  }
}

@media print {
  body {
    background: white;
  }
  
  .header {
    box-shadow: none;
  }
  
  .controls {
    display: none;
  }
  
  .update-card {
    break-inside: avoid;
  }
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-content">
      <div>
        <div class="eyebrow">Business Intelligence Team</div>
        <h1>Weekly Updates Archive</h1>
        <p>Browse past weekly BI team updates covering HB1 integration, projects, initiatives, and team activities.</p>
      </div>
      <div class="stats">
        <div class="stat-box">
          <small>Total</small>
          <strong id="totalCount">0</strong>
          <span>Updates</span>
        </div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search updates by week, summary, or content...">
    </div>
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="green">Green</button>
      <button class="filter-btn" data-filter="amber">Amber</button>
      <button class="filter-btn" data-filter="red">Red</button>
    </div>
  </div>

  <div class="updates-grid" id="updatesGrid">
    <!-- Updates will be dynamically inserted here -->
  </div>

  <div class="empty-state" id="emptyState" style="display: none;">
    <div class="empty-state-icon">📊</div>
    <h3>No updates found</h3>
    <p>Try adjusting your search or filter criteria.</p>
  </div>
</div>

<script>
// Weekly updates data - Add new updates here
const weeklyUpdates = [
  {
    week: "W32",
    year: 2026,
    dateRange: "3–7 August 2026",
    status: "amber",
    statusLabel: "Amber",
    title: "BI Team Weekly Update — W32",
    summary: "Testing dependencies require attention. Scorecard, Mega Report and MMM Report continue through internal and external testing. Development progressing for Indemnity Report and GP Calculator.",
    fileName: "weekly-updates/w32-2026.html",
    projects: 9,
    adHoc: 2,
    risks: 2,
    owner: "BI Team"
  },
  // Add more updates here as they become available
];

// Sort updates by week (newest first)
weeklyUpdates.sort((a, b) => {
  if (a.year !== b.year) return b.year - a.year;
  return parseInt(b.week.substring(1)) - parseInt(a.week.substring(1));
});

// Initialize
const updatesGrid = document.getElementById('updatesGrid');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('searchInput');
const filterButtons = document.querySelectorAll('.filter-btn');
const totalCount = document.getElementById('totalCount');

let currentFilter = 'all';
let currentSearch = '';

function renderUpdates() {
  const filtered = weeklyUpdates.filter(update => {
    const matchesFilter = currentFilter === 'all' || update.status === currentFilter;
    const matchesSearch = !currentSearch || 
      update.week.toLowerCase().includes(currentSearch) ||
      update.title.toLowerCase().includes(currentSearch) ||
      update.summary.toLowerCase().includes(currentSearch) ||
      update.dateRange.toLowerCase().includes(currentSearch);
    return matchesFilter && matchesSearch;
  });

  totalCount.textContent = weeklyUpdates.length;

  if (filtered.length === 0) {
    updatesGrid.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }

  updatesGrid.style.display = 'grid';
  emptyState.style.display = 'none';

  updatesGrid.innerHTML = filtered.map(update => `
    <a href="${update.fileName}" class="update-card">
      <div class="update-header">
        <div class="week-badge">${update.week}</div>
        <span class="status-badge ${update.status}">${update.statusLabel}</span>
      </div>
      <div class="update-date">${update.dateRange}</div>
      <h2 class="update-title">${update.title}</h2>
      <p class="update-summary">${update.summary}</p>
      <div class="update-meta">
        <div class="meta-item">
          📊 <strong>${update.projects}</strong> Projects
        </div>
        <div class="meta-item">
          📋 <strong>${update.adHoc}</strong> Ad hoc
        </div>
        <div class="meta-item">
          ⚠️ <strong>${update.risks}</strong> Risks
        </div>
      </div>
    </a>
  `).join('');
}

// Event listeners
searchInput.addEventListener('input', (e) => {
  currentSearch = e.target.value.toLowerCase();
  renderUpdates();
});

filterButtons.forEach(button => {
  button.addEventListener('click', () => {
    filterButtons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
    currentFilter = button.dataset.filter;
    renderUpdates();
  });
});

// Initial render
renderUpdates();
</script>
</body>
</html>
