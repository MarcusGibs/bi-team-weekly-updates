<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - BI Team Weekly Updates</title>
<style>
:root {
  --navy:#10233f;
  --blue:#2563eb;
  --bg:#eef3f8;
  --text:#172033;
  --muted:#667085;
  --line:#dbe3ec;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  line-height: 1.6;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.header {
  padding: 24px 32px;
  border-radius: 16px;
  color: white;
  background: linear-gradient(135deg, #0b1f3a 0%, #17365f 58%, #0f766e 135%);
  box-shadow: 0 8px 24px rgba(15,35,63,.15);
  margin-bottom: 32px;
}

h1 {
  margin: 0 0 8px 0;
  font-size: 32px;
  letter-spacing: -.02em;
}

.header p {
  margin: 0;
  opacity: 0.9;
  font-size: 14px;
}

.nav-links {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

.nav-link {
  padding: 8px 16px;
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 8px;
  color: white;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
}

.nav-link:hover {
  background: rgba(255,255,255,.25);
}

.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 24px;
  box-shadow: 0 4px 12px rgba(15,35,63,.04);
}

.card h2 {
  margin: 0 0 20px 0;
  color: var(--navy);
  font-size: 24px;
  letter-spacing: -.02em;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: var(--navy);
  font-size: 14px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  transition: all 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

.form-group textarea {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.priority-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.priority-item {
  display: flex;
  gap: 8px;
  align-items: center;
}

.priority-item input {
  flex: 1;
}

.btn-small {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-small:hover {
  background: #f8fafc;
  border-color: var(--blue);
}

.btn-remove {
  color: #dc2626;
  border-color: #fecaca;
}

.btn-remove:hover {
  background: #fef2f2;
  border-color: #dc2626;
}

.btn-primary {
  padding: 14px 32px;
  border: none;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary:hover {
  background: #1d4ed8;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(37,99,235,.3);
}

.btn-secondary {
  padding: 14px 32px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: 12px;
}

.btn-secondary:hover {
  background: #f8fafc;
  border-color: var(--blue);
}

.updates-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.update-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: all 0.2s;
}

.update-item:hover {
  background: white;
  box-shadow: 0 2px 8px rgba(15,35,63,.08);
}

.update-info {
  flex: 1;
}

.update-week {
  font-size: 18px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}

.update-date {
  font-size: 13px;
  color: var(--muted);
}

.update-actions {
  display: flex;
  gap: 8px;
}

.status-indicator {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 8px;
}

.status-green { background: #22c55e; }
.status-amber { background: #f59e0b; }
.status-red { background: #ef4444; }

.alert {
  padding: 16px 20px;
  border-radius: 12px;
  margin-bottom: 24px;
  font-size: 14px;
}

.alert-success {
  background: #dcfce7;
  color: #166534;
  border: 1px solid #bbf7d0;
}

.alert-error {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #fecaca;
}

.alert-info {
  background: #dbeafe;
  color: #1e40af;
  border: 1px solid #bfdbfe;
}

.project-card {
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}

.project-card h4 {
  margin: 0 0 16px 0;
  color: var(--navy);
  font-size: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 12px;
}

.stage-checkboxes {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 12px 0;
}

.stage-checkbox {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.stage-checkbox:hover {
  border-color: var(--blue);
}

.stage-checkbox input[type="checkbox"] {
  width: auto;
  margin: 0;
}

.stage-checkbox label {
  margin: 0;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
}

@media (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;
  }
  
  .container {
    padding: 16px;
  }
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>📊 Weekly Updates Admin</h1>
    <p>Create and manage your BI Team weekly updates</p>
    <div class="nav-links">
      <a href="index.html" class="nav-link">← Back to Updates</a>
      <a href="team.html" class="nav-link">Team Page</a>
    </div>
  </header>

  <div id="alertContainer"></div>

  <div class="card">
    <h2>Existing Updates</h2>
    <div class="updates-list" id="updatesList">
      <p style="color: var(--muted);">Loading updates...</p>
    </div>
  </div>

  <div class="card">
    <h2 id="formTitle">Add New Weekly Update</h2>
    <form id="updateForm">
      <input type="hidden" id="editIndex" value="">
      
      <div class="form-row">
        <div class="form-group">
          <label for="week">Week Number *</label>
          <input type="text" id="week" placeholder="W32" required>
        </div>
        <div class="form-group">
          <label for="year">Year *</label>
          <input type="number" id="year" placeholder="2026" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dateRange">Date Range *</label>
          <input type="text" id="dateRange" placeholder="3–7 August 2026" required>
        </div>
        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" required>
            <option value="green">Green</option>
            <option value="amber">Amber</option>
            <option value="red">Red</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" placeholder="BI Team Weekly Update — W32" required>
      </div>

      <div class="form-group">
        <label for="summary">Summary (for card) *</label>
        <textarea id="summary" placeholder="Brief summary shown on the updates listing page..." required></textarea>
      </div>

      <div class="form-group">
        <label for="executiveSummary">Executive Summary (for detail page)</label>
        <textarea id="executiveSummary" placeholder="Detailed executive summary for the full weekly update page..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="projects">Number of Projects *</label>
          <input type="number" id="projects" placeholder="9" required>
        </div>
        <div class="form-group">
          <label for="adHoc">Ad Hoc Requests *</label>
          <input type="number" id="adHoc" placeholder="2" required>
        </div>
      </div>

      <div class="form-group">
        <label for="risks">Active Risks *</label>
        <input type="number" id="risks" placeholder="2" required>
      </div>

      <div class="form-group">
        <label>Immediate Priorities</label>
        <div class="priority-list" id="priorityList">
          <div class="priority-item">
            <input type="text" class="priority-input" placeholder="Priority 1">
            <button type="button" class="btn-small btn-remove" onclick="removePriority(this)">Remove</button>
          </div>
        </div>
        <button type="button" class="btn-small" onclick="addPriority()" style="margin-top: 8px;">+ Add Priority</button>
      </div>

      <hr style="margin: 40px 0; border: none; border-top: 2px solid var(--line);">

      <h3 style="margin-bottom: 20px; color: var(--navy);">HB1 Integration Projects</h3>
      <div id="hb1ProjectsList"></div>
      <button type="button" class="btn-small" onclick="addProject('hb1')" style="margin-top: 12px;">+ Add HB1 Project</button>

      <hr style="margin: 40px 0; border: none; border-top: 2px solid var(--line);">

      <h3 style="margin-bottom: 20px; color: var(--navy);">Other Projects</h3>
      <div id="otherProjectsList"></div>
      <button type="button" class="btn-small" onclick="addProject('other')" style="margin-top: 12px;">+ Add Other Project</button>

      <hr style="margin: 40px 0; border: none; border-top: 2px solid var(--line);">

      <h3 style="margin-bottom: 20px; color: var(--navy);">Ad Hoc Requests</h3>
      <div id="adHocList"></div>
      <button type="button" class="btn-small" onclick="addAdHoc()" style="margin-top: 12px;">+ Add Ad Hoc Request</button>

      <hr style="margin: 40px 0; border: none; border-top: 2px solid var(--line);">

      <h3 style="margin-bottom: 20px; color: var(--navy);">Risks & Dependencies</h3>
      <div id="risksList"></div>
      <button type="button" class="btn-small" onclick="addRisk()" style="margin-top: 12px;">+ Add Risk</button>

      <div style="margin-top: 32px;">
        <button type="submit" class="btn-primary">💾 Save Update</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Cancel</button>
        <button type="button" class="btn-secondary" onclick="downloadJSON()">Download JSON</button>
      </div>
    </form>
  </div>
</div>

<script>
let updatesData = { updates: [] };

// Load existing updates
async function loadUpdates() {
  try {
    const response = await fetch('data/updates.json');
    if (response.ok) {
      updatesData = await response.json();
      displayUpdates();
    }
  } catch (error) {
    console.log('No existing updates found, starting fresh');
  }
}

function displayUpdates() {
  const list = document.getElementById('updatesList');
  if (updatesData.updates.length === 0) {
    list.innerHTML = '<p style="color: var(--muted);">No updates yet. Create your first one below!</p>';
    return;
  }

  list.innerHTML = updatesData.updates.map((update, index) => `
    <div class="update-item">
      <div class="update-info">
        <div class="update-week">
          <span class="status-indicator status-${update.status}"></span>
          ${update.week} (${update.year})
        </div>
        <div class="update-date">${update.dateRange} - ${update.statusLabel}</div>
      </div>
      <div class="update-actions">
        <button class="btn-small" onclick="editUpdate(${index})">Edit</button>
        <button class="btn-small btn-remove" onclick="deleteUpdate(${index})">Delete</button>
      </div>
    </div>
  `).join('');
}

function addPriority() {
  const list = document.getElementById('priorityList');
  const item = document.createElement('div');
  item.className = 'priority-item';
  item.innerHTML = `
    <input type="text" class="priority-input" placeholder="Priority ${list.children.length + 1}">
    <button type="button" class="btn-small btn-remove" onclick="removePriority(this)">Remove</button>
  `;
  list.appendChild(item);
}

function removePriority(btn) {
  btn.parentElement.remove();
}

function addProject(type) {
  const listId = type === 'hb1' ? 'hb1ProjectsList' : 'otherProjectsList';
  const list = document.getElementById(listId);
  const index = list.children.length;
  
  const projectCard = document.createElement('div');
  projectCard.className = 'project-card';
  projectCard.innerHTML = `
    <h4>
      <span>Project ${index + 1}</span>
      <button type="button" class="btn-small btn-remove" onclick="this.closest('.project-card').remove()">Remove</button>
    </h4>
    <div class="project-grid">
      <div class="form-group" style="margin: 0;">
        <label>Project Name *</label>
        <input type="text" class="project-name" placeholder="Scorecard" required>
      </div>
      <div class="form-group" style="margin: 0;">
        <label>Technology *</label>
        <input type="text" class="project-tech" placeholder="Power BI" required>
      </div>
      <div class="form-group" style="margin: 0;">
        <label>Owner *</label>
        <input type="text" class="project-owner" placeholder="Mark" required>
      </div>
    </div>
    ${type === 'hb1' ? `
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Delivery Stages (check completed/in-progress)</label>
      <div class="stage-checkboxes">
        <div class="stage-checkbox">
          <input type="checkbox" class="stage-scoping" id="scoping-${index}">
          <label for="scoping-${index}">Scoping</label>
        </div>
        <div class="stage-checkbox">
          <input type="checkbox" class="stage-development" id="development-${index}">
          <label for="development-${index}">Development</label>
        </div>
        <div class="stage-checkbox">
          <input type="checkbox" class="stage-internal" id="internal-${index}">
          <label for="internal-${index}">Internal Testing</label>
        </div>
        <div class="stage-checkbox">
          <input type="checkbox" class="stage-external" id="external-${index}">
          <label for="external-${index}">External Testing</label>
        </div>
        <div class="stage-checkbox">
          <input type="checkbox" class="stage-uat" id="uat-${index}">
          <label for="uat-${index}">UAT</label>
        </div>
        <div class="stage-checkbox">
          <input type="checkbox" class="stage-hypercare" id="hypercare-${index}">
          <label for="hypercare-${index}">Hypercare</label>
        </div>
      </div>
    </div>
    ` : `
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Status</label>
      <select class="project-status">
        <option value="done">Done</option>
        <option value="progress">In Progress</option>
        <option value="paused">Paused</option>
        <option value="pending">Pending</option>
      </select>
    </div>
    `}
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>This Week Update</label>
      <textarea class="project-update" placeholder="What happened this week..." rows="2"></textarea>
    </div>
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Next Action</label>
      <textarea class="project-next" placeholder="What's next..." rows="2"></textarea>
    </div>
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Forecast</label>
      <input type="text" class="project-forecast" placeholder="TBC — UAT readiness">
    </div>
  `;
  list.appendChild(projectCard);
}

function addAdHoc() {
  const list = document.getElementById('adHocList');
  const card = document.createElement('div');
  card.className = 'project-card';
  card.innerHTML = `
    <h4>
      <span>Request ${list.children.length + 1}</span>
      <button type="button" class="btn-small btn-remove" onclick="this.closest('.project-card').remove()">Remove</button>
    </h4>
    <div class="project-grid">
      <div class="form-group" style="margin: 0;">
        <label>Request Name *</label>
        <input type="text" class="adhoc-name" placeholder="Costing Sheet Macro Review" required>
      </div>
      <div class="form-group" style="margin: 0;">
        <label>Technology</label>
        <input type="text" class="adhoc-tech" placeholder="Excel">
      </div>
      <div class="form-group" style="margin: 0;">
        <label>Raised By</label>
        <input type="text" class="adhoc-raised" placeholder="Justin & Gavin">
      </div>
    </div>
    <div class="project-grid" style="grid-template-columns: 1fr 1fr;">
      <div class="form-group" style="margin: 12px 0 0 0;">
        <label>Status</label>
        <select class="adhoc-status">
          <option value="monitoring">Monitoring</option>
          <option value="progress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-group" style="margin: 12px 0 0 0;">
        <label>Owner</label>
        <input type="text" class="adhoc-owner" placeholder="Mark">
      </div>
    </div>
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Next Action</label>
      <textarea class="adhoc-next" placeholder="Continue monitoring and support..." rows="2"></textarea>
    </div>
  `;
  list.appendChild(card);
}

function addRisk() {
  const list = document.getElementById('risksList');
  const card = document.createElement('div');
  card.className = 'project-card';
  card.innerHTML = `
    <h4>
      <span>Risk ${list.children.length + 1}</span>
      <button type="button" class="btn-small btn-remove" onclick="this.closest('.project-card').remove()">Remove</button>
    </h4>
    <div class="form-group" style="margin: 0;">
      <label>Risk Level</label>
      <select class="risk-level">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Risk Description *</label>
      <input type="text" class="risk-name" placeholder="HB1 Margin data is not finalised..." required>
    </div>
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Impact</label>
      <textarea class="risk-impact" placeholder="Scheduled and Actual Margin fields are not yet finalised..." rows="2"></textarea>
    </div>
    <div class="form-group" style="margin: 12px 0 0 0;">
      <label>Affected Reports</label>
      <input type="text" class="risk-affected" placeholder="Scorecard; Gross Margin Report">
    </div>
  `;
  list.appendChild(card);
}

function removePriority(btn) {
  btn.parentElement.remove();
}

function getNextWeekNumber() {
  if (!updatesData.updates || updatesData.updates.length === 0) {
    return 'W1';
  }
  // Get the most recent update (first in array)
  const latestUpdate = updatesData.updates[0];
  const weekMatch = latestUpdate.week.match(/W(\d+)/);
  if (weekMatch) {
    const nextWeekNum = parseInt(weekMatch[1]) + 1;
    return `W${nextWeekNum}`;
  }
  return 'W1';
}

function preloadPreviousWeek() {
  if (!updatesData.updates || updatesData.updates.length === 0) {
    return; // No previous data to load
  }

  const previousUpdate = updatesData.updates[0]; // Most recent update
  const nextWeek = getNextWeekNumber();
  const nextYear = previousUpdate.year; // Keep same year (user can change if needed)

  // Auto-fill form with previous week's data
  document.getElementById('week').value = nextWeek;
  document.getElementById('year').value = nextYear;
  document.getElementById('dateRange').value = ''; // User needs to update this
  document.getElementById('status').value = previousUpdate.status;
  document.getElementById('title').value = `BI Team Weekly Update — ${nextWeek}`;
  document.getElementById('summary').value = previousUpdate.summary;
  document.getElementById('executiveSummary').value = previousUpdate.executiveSummary || '';
  document.getElementById('projects').value = previousUpdate.projects;
  document.getElementById('adHoc').value = previousUpdate.adHoc;
  document.getElementById('risks').value = previousUpdate.risks;

  // Load priorities
  const priorityList = document.getElementById('priorityList');
  priorityList.innerHTML = '';
  (previousUpdate.priorities || []).forEach((priority, i) => {
    const item = document.createElement('div');
    item.className = 'priority-item';
    item.innerHTML = `
      <input type="text" class="priority-input" value="${priority}" placeholder="Priority ${i + 1}">
      <button type="button" class="btn-small btn-remove" onclick="removePriority(this)">Remove</button>
    `;
    priorityList.appendChild(item);
  });

  // Load HB1 projects
  document.getElementById('hb1ProjectsList').innerHTML = '';
  (previousUpdate.hb1Projects || []).forEach(() => {
    addProject('hb1');
  });
  const hb1Cards = document.querySelectorAll('#hb1ProjectsList .project-card');
  (previousUpdate.hb1Projects || []).forEach((proj, i) => {
    const card = hb1Cards[i];
    card.querySelector('.project-name').value = proj.name;
    card.querySelector('.project-tech').value = proj.technology;
    card.querySelector('.project-owner').value = proj.owner;
    if (proj.stages) {
      card.querySelector('.stage-scoping').checked = proj.stages.scoping;
      card.querySelector('.stage-development').checked = proj.stages.development;
      card.querySelector('.stage-internal').checked = proj.stages.internalTesting;
      card.querySelector('.stage-external').checked = proj.stages.externalTesting;
      card.querySelector('.stage-uat').checked = proj.stages.uat;
      card.querySelector('.stage-hypercare').checked = proj.stages.hypercare;
    }
    card.querySelector('.project-update').value = proj.thisWeek || '';
    card.querySelector('.project-next').value = proj.nextAction || '';
    card.querySelector('.project-forecast').value = proj.forecast || '';
  });

  // Load other projects
  document.getElementById('otherProjectsList').innerHTML = '';
  (previousUpdate.otherProjects || []).forEach(() => {
    addProject('other');
  });
  const otherCards = document.querySelectorAll('#otherProjectsList .project-card');
  (previousUpdate.otherProjects || []).forEach((proj, i) => {
    const card = otherCards[i];
    card.querySelector('.project-name').value = proj.name;
    card.querySelector('.project-tech').value = proj.technology;
    card.querySelector('.project-owner').value = proj.owner;
    card.querySelector('.project-status').value = proj.status || 'progress';
    card.querySelector('.project-update').value = proj.thisWeek || '';
    card.querySelector('.project-next').value = proj.nextAction || '';
    card.querySelector('.project-forecast').value = proj.forecast || '';
  });

  // Load ad hoc requests
  document.getElementById('adHocList').innerHTML = '';
  (previousUpdate.adHocRequests || []).forEach(() => {
    addAdHoc();
  });
  const adHocCards = document.querySelectorAll('#adHocList .project-card');
  (previousUpdate.adHocRequests || []).forEach((req, i) => {
    const card = adHocCards[i];
    card.querySelector('.adhoc-name').value = req.name;
    card.querySelector('.adhoc-tech').value = req.technology || '';
    card.querySelector('.adhoc-raised').value = req.raisedBy || '';
    card.querySelector('.adhoc-status').value = req.status || 'monitoring';
    card.querySelector('.adhoc-owner').value = req.owner || '';
    card.querySelector('.adhoc-next').value = req.nextAction || '';
  });

  // Load risks
  document.getElementById('risksList').innerHTML = '';
  (previousUpdate.riskDetails || []).forEach(() => {
    addRisk();
  });
  const riskCards = document.querySelectorAll('#risksList .project-card');
  (previousUpdate.riskDetails || []).forEach((risk, i) => {
    const card = riskCards[i];
    card.querySelector('.risk-name').value = risk.name;
    card.querySelector('.risk-category').value = risk.category || 'quality';
    card.querySelector('.risk-likelihood').value = risk.likelihood || 'medium';
    card.querySelector('.risk-impact').value = risk.impact || 'medium';
    card.querySelector('.risk-mitigation').value = risk.mitigation || '';
    card.querySelector('.risk-affected').value = risk.affected || '';
  });

  // Update form title
  document.getElementById('formTitle').textContent = `Create ${nextWeek} (Pre-loaded from ${previousUpdate.week})`;
  showAlert(`Form pre-loaded with ${previousUpdate.week} data. Update the Date Range and modify as needed.`, 'info');
}

function editUpdate(index) {
  const update = updatesData.updates[index];
  document.getElementById('editIndex').value = index;
  document.getElementById('formTitle').textContent = `Edit Update: ${update.week}`;
  document.getElementById('week').value = update.week;
  document.getElementById('year').value = update.year;
  document.getElementById('dateRange').value = update.dateRange;
  document.getElementById('status').value = update.status;
  document.getElementById('title').value = update.title;
  document.getElementById('summary').value = update.summary;
  document.getElementById('executiveSummary').value = update.executiveSummary || '';
  document.getElementById('projects').value = update.projects;
  document.getElementById('adHoc').value = update.adHoc;
  document.getElementById('risks').value = update.risks;

  // Load priorities
  const priorityList = document.getElementById('priorityList');
  priorityList.innerHTML = '';
  (update.priorities || []).forEach((priority, i) => {
    const item = document.createElement('div');
    item.className = 'priority-item';
    item.innerHTML = `
      <input type="text" class="priority-input" value="${priority}" placeholder="Priority ${i + 1}">
      <button type="button" class="btn-small btn-remove" onclick="removePriority(this)">Remove</button>
    `;
    priorityList.appendChild(item);
  });

  // Load HB1 projects
  document.getElementById('hb1ProjectsList').innerHTML = '';
  (update.hb1Projects || []).forEach(() => {
    addProject('hb1');
  });
  const hb1Cards = document.querySelectorAll('#hb1ProjectsList .project-card');
  (update.hb1Projects || []).forEach((proj, i) => {
    const card = hb1Cards[i];
    card.querySelector('.project-name').value = proj.name;
    card.querySelector('.project-tech').value = proj.technology;
    card.querySelector('.project-owner').value = proj.owner;
    if (proj.stages) {
      card.querySelector('.stage-scoping').checked = proj.stages.scoping;
      card.querySelector('.stage-development').checked = proj.stages.development;
      card.querySelector('.stage-internal').checked = proj.stages.internalTesting;
      card.querySelector('.stage-external').checked = proj.stages.externalTesting;
      card.querySelector('.stage-uat').checked = proj.stages.uat;
      card.querySelector('.stage-hypercare').checked = proj.stages.hypercare;
    }
    card.querySelector('.project-update').value = proj.thisWeek || '';
    card.querySelector('.project-next').value = proj.nextAction || '';
    card.querySelector('.project-forecast').value = proj.forecast || '';
  });

  // Load other projects
  document.getElementById('otherProjectsList').innerHTML = '';
  (update.otherProjects || []).forEach(() => {
    addProject('other');
  });
  const otherCards = document.querySelectorAll('#otherProjectsList .project-card');
  (update.otherProjects || []).forEach((proj, i) => {
    const card = otherCards[i];
    card.querySelector('.project-name').value = proj.name;
    card.querySelector('.project-tech').value = proj.technology;
    card.querySelector('.project-owner').value = proj.owner;
    card.querySelector('.project-status').value = proj.status || 'progress';
    card.querySelector('.project-update').value = proj.thisWeek || '';
    card.querySelector('.project-next').value = proj.nextAction || '';
    card.querySelector('.project-forecast').value = proj.forecast || '';
  });

  // Load ad hoc requests
  document.getElementById('adHocList').innerHTML = '';
  (update.adHocRequests || []).forEach(() => {
    addAdHoc();
  });
  const adHocCards = document.querySelectorAll('#adHocList .project-card');
  (update.adHocRequests || []).forEach((req, i) => {
    const card = adHocCards[i];
    card.querySelector('.adhoc-name').value = req.name;
    card.querySelector('.adhoc-tech').value = req.technology || '';
    card.querySelector('.adhoc-raised').value = req.raisedBy || '';
    card.querySelector('.adhoc-status').value = req.status || 'monitoring';
    card.querySelector('.adhoc-owner').value = req.owner || '';
    card.querySelector('.adhoc-next').value = req.nextAction || '';
  });

  // Load risks
  document.getElementById('risksList').innerHTML = '';
  (update.riskDetails || []).forEach(() => {
    addRisk();
  });
  const riskCards = document.querySelectorAll('#risksList .project-card');
  (update.riskDetails || []).forEach((risk, i) => {
    const card = riskCards[i];
    card.querySelector('.risk-level').value = risk.level || 'high';
    card.querySelector('.risk-name').value = risk.risk;
    card.querySelector('.risk-impact').value = risk.impact || '';
    card.querySelector('.risk-affected').value = risk.affectedReports || '';
  });

  window.scrollTo({ top: document.getElementById('updateForm').offsetTop - 100, behavior: 'smooth' });
}

function deleteUpdate(index) {
  if (confirm('Are you sure you want to delete this update?')) {
    updatesData.updates.splice(index, 1);
    displayUpdates();
    showAlert('Update deleted successfully!', 'success');
  }
}

function resetForm() {
  document.getElementById('updateForm').reset();
  document.getElementById('editIndex').value = '';
  const priorityList = document.getElementById('priorityList');
  priorityList.innerHTML = '';
  document.getElementById('hb1ProjectsList').innerHTML = '';
  document.getElementById('otherProjectsList').innerHTML = '';
  document.getElementById('adHocList').innerHTML = '';
  document.getElementById('risksList').innerHTML = '';
  
  // After reset, automatically pre-load previous week's data
  setTimeout(() => preloadPreviousWeek(), 100);
}

function showAlert(message, type = 'info') {
  const alertContainer = document.getElementById('alertContainer');
  const alert = document.createElement('div');
  alert.className = `alert alert-${type}`;
  alert.textContent = message;
  alertContainer.appendChild(alert);
  setTimeout(() => alert.remove(), 5000);
}

document.getElementById('updateForm').addEventListener('submit', (e) => {
  e.preventDefault();
  
  const priorities = Array.from(document.querySelectorAll('.priority-input'))
    .map(input => input.value.trim())
    .filter(val => val);

  // Collect HB1 projects
  const hb1Projects = Array.from(document.querySelectorAll('#hb1ProjectsList .project-card')).map(card => ({
    name: card.querySelector('.project-name').value,
    technology: card.querySelector('.project-tech').value,
    owner: card.querySelector('.project-owner').value,
    stages: {
      scoping: card.querySelector('.stage-scoping')?.checked || false,
      development: card.querySelector('.stage-development')?.checked || false,
      internalTesting: card.querySelector('.stage-internal')?.checked || false,
      externalTesting: card.querySelector('.stage-external')?.checked || false,
      uat: card.querySelector('.stage-uat')?.checked || false,
      hypercare: card.querySelector('.stage-hypercare')?.checked || false
    },
    thisWeek: card.querySelector('.project-update').value,
    nextAction: card.querySelector('.project-next').value,
    forecast: card.querySelector('.project-forecast').value
  }));

  // Collect other projects
  const otherProjects = Array.from(document.querySelectorAll('#otherProjectsList .project-card')).map(card => ({
    name: card.querySelector('.project-name').value,
    technology: card.querySelector('.project-tech').value,
    owner: card.querySelector('.project-owner').value,
    status: card.querySelector('.project-status').value,
    thisWeek: card.querySelector('.project-update').value,
    nextAction: card.querySelector('.project-next').value,
    forecast: card.querySelector('.project-forecast').value
  }));

  // Collect ad hoc requests
  const adHocRequests = Array.from(document.querySelectorAll('#adHocList .project-card')).map(card => ({
    name: card.querySelector('.adhoc-name').value,
    technology: card.querySelector('.adhoc-tech').value,
    raisedBy: card.querySelector('.adhoc-raised').value,
    status: card.querySelector('.adhoc-status').value,
    owner: card.querySelector('.adhoc-owner').value,
    nextAction: card.querySelector('.adhoc-next').value
  }));

  // Collect risks
  const risks = Array.from(document.querySelectorAll('#risksList .project-card')).map(card => ({
    level: card.querySelector('.risk-level').value,
    risk: card.querySelector('.risk-name').value,
    impact: card.querySelector('.risk-impact').value,
    affectedReports: card.querySelector('.risk-affected').value
  }));

  const status = document.getElementById('status').value;
  const statusLabels = { green: 'Green', amber: 'Amber', red: 'Red' };
  
  const week = document.getElementById('week').value;
  const year = document.getElementById('year').value;
  const fileName = `weekly-updates/${week.toLowerCase()}-${year}.html`;

  const update = {
    week,
    year: parseInt(year),
    dateRange: document.getElementById('dateRange').value,
    status,
    statusLabel: statusLabels[status],
    title: document.getElementById('title').value,
    summary: document.getElementById('summary').value,
    fileName,
    projects: parseInt(document.getElementById('projects').value),
    adHoc: parseInt(document.getElementById('adHoc').value),
    risks: parseInt(document.getElementById('risks').value),
    owner: "BI Team",
    executiveSummary: document.getElementById('executiveSummary').value,
    priorities,
    hb1Projects,
    otherProjects,
    adHocRequests,
    riskDetails: risks
  };

  const editIndex = document.getElementById('editIndex').value;
  if (editIndex !== '') {
    updatesData.updates[parseInt(editIndex)] = update;
    showAlert('Update modified successfully!', 'success');
  } else {
    updatesData.updates.unshift(update);
    showAlert('Update added successfully!', 'success');
  }

  displayUpdates();
  resetForm();
  
  showAlert('Don\'t forget to download the JSON and commit changes to GitHub!', 'info');
});

function downloadJSON() {
  const dataStr = JSON.stringify(updatesData, null, 2);
  const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
  const exportFileDefaultName = 'updates.json';
  
  const linkElement = document.createElement('a');
  linkElement.setAttribute('href', dataUri);
  linkElement.setAttribute('download', exportFileDefaultName);
  linkElement.click();
  
  showAlert('JSON file downloaded! Replace data/updates.json with this file and push to GitHub.', 'success');
}

// Initialize
loadUpdates().then(() => {
  // After loading existing updates, pre-load form with next week's data
  preloadPreviousWeek();
});
</script>
</body>
